<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b6b3a">

  <link rel="manifest" href="ios-manifest.webmanifest?v=641">

  <script src="ios-config.js?v=641"></script>
  <script src="ios-app.js?v=641"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./ios-sw.js?v=641', { updateViaCache: 'none' });
          await reg.update();
        } catch (_) {}
      });
    }
  </script>
