<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b6b3a">
  <meta name="description" content="نظام إدارة مدرسة المنارة الخاصة وبوابة أولياء الأمور">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="المنارة">
  <title>مدرسة المنارة</title>
  <link rel="stylesheet" href="ios-style.css">
  <link rel="manifest" href="ios-manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png" type="image/png">
  <style>
    #iosInstallHint{position:fixed;z-index:99999;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));background:#fff;border:1px solid #d7e2dc;border-radius:18px;padding:13px 14px;box-shadow:0 12px 35px rgba(0,0,0,.18);font-family:Tahoma,Arial,sans-serif;color:#173047;display:none}
    #iosInstallHint .hint-row{display:flex;align-items:flex-start;gap:10px}
    #iosInstallHint img{width:42px;height:42px;border-radius:10px;object-fit:cover;flex:0 0 auto}
    #iosInstallHint b{display:block;color:#0b6b3a;margin-bottom:4px}
    #iosInstallHint span{font-size:13px;line-height:1.7;color:#516270}
    #iosInstallHint button{border:0;background:transparent;font-size:22px;line-height:1;color:#667;cursor:pointer;margin-right:auto}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="iosInstallHint" aria-live="polite">
    <div class="hint-row">
      <img src="logo.jpg" alt="شعار مدرسة المنارة">
      <div><b>ثبّت تطبيق المنارة على الآيفون</b><span>من Safari اضغط زر المشاركة ⬆️ ثم اختر «إضافة إلى الشاشة الرئيسية» وبعدها «إضافة».</span></div>
      <button type="button" onclick="document.getElementById('iosInstallHint').style.display='none'" aria-label="إغلاق">×</button>
    </div>
  </div>
  <script src="ios-supabase.js"></script>
  <script src="ios-config.js"></script>
  <script src="ios-app.js"></script>
  <script>
    (function(){
      const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
      if (isiOS && !standalone) document.getElementById('iosInstallHint').style.display='block';
      if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./ios-sw.js').catch(()=>{}));
    })();
  </script>
</body>
</html>
