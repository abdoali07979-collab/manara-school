<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b6b3a">
  <meta name="description" content="نظام إدارة مدرسة المنارة الخاصة وبوابة أولياء الأمور">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="المنارة">
  <title>مدرسة المنارة</title>
  <link rel="stylesheet" href="ios-style.css?v=650">
  <link rel="manifest" href="ios-manifest.webmanifest?v=650">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=650">
  <link rel="icon" href="icon-192.png?v=650" type="image/png">
</head>
<body>
  <div id="app"></div>
  <script src="ios-supabase.js?v=650"></script>
  <script src="ios-config.js?v=650"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="ios-app.js?v=650"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./ios-sw.js?v=650', { updateViaCache: 'none' });
          await reg.update();
        } catch (_) {}
      });
    }
  </script>
</body>
</html>
